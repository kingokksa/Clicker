name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4.3.0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Clicker-${tag}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-release
          path: Clicker-*.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (full)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --flavor full && break
            echo "Full build attempt $i failed (Maven Central 403 is often transient); retrying..."
            sleep 15
          done
          # Fail hard if all attempts failed
          test -f build/app/outputs/flutter-apk/app-full-release.apk

      - name: Build APK (lite)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --flavor lite && break
            echo "Lite build attempt $i failed (Maven Central 403 is often transient); retrying..."
            sleep 15
          done
          test -f build/app/outputs/flutter-apk/app-lite-release.apk

      - name: Rename APKs
        run: |
          tag="${{ github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-full-release.apk "Clicker-${tag}-android-full.apk"
          mv build/app/outputs/flutter-apk/app-lite-release.apk "Clicker-${tag}-android-lite.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-release
          path: Clicker-*.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.0

      - uses: actions/download-artifact@v4.3.0
        with:
          name: windows-release
          path: artifacts/

      - uses: actions/download-artifact@v4.3.0
        with:
          name: android-release
          path: artifacts/

      - name: Create Release
        run: |
          tag="${{ github.ref_name }}"
          # 先清理同 tag 可能残留的 release（删除 tag 时可能留下 draft/哑 release），
          # 避免重复创建；用 gh CLI 直接创建，失败会显式退出（不再是静默 success）。
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" artifacts/Clicker-* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
